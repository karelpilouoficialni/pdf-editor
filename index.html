<!doctype html>
<html lang="cs">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Editor</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>
    <div id="toast-container"></div>

    <header>
        <h1>PDF Editor</h1>
        <div class="header-actions">
            <button id="theme-toggle" class="icon-btn" title="Přepnout motiv">🌙</button>
            <button id="undo-btn" class="icon-btn" title="Zpět (Ctrl+Z)">↩</button>
            <button id="redo-btn" class="icon-btn" title="Znovu (Ctrl+Y)">↪</button>
        </div>
    </header>

    <main>
        <div class="layout">
            <aside class="sidebar">
                <section>
                    <h2>📂 Soubory</h2>
                    <div id="drop-area">
                        <p>Přetáhněte PDF soubory sem</p>
                        <input type="file" id="file-input" accept="application/pdf,.pdf" multiple />
                        <label for="file-input" class="file-label">Vybrat soubory</label>
                    </div>
                    <div class="btn-row">
                        <button id="load-files-btn" class="btn btn-primary">Načíst soubory</button>
                        <button id="reset-btn" class="btn btn-danger">Vymazat vše</button>
                    </div>
                    <div id="file-list"></div>
                    <div id="pdf-info"></div>
                </section>

                <section>
                    <h2>✏️ Úpravy stránky</h2>
                    <div class="form-group">
                        <label>Text:</label>
                        <input type="text" id="text-input" placeholder="Zadejte text" />
                    </div>
                    <div class="inline-group">
                        <label>Velikost: <input type="number" id="font-size" value="12" /></label>
                        <label>Barva: <input type="color" id="text-color" value="#000000" /></label>
                    </div>
                    <button id="add-text-btn" class="btn btn-primary">Přidat text</button>
                    <hr />
                    <div class="btn-row">
                        <button id="delete-page-btn" class="btn btn-danger">Smazat stránku</button>
                        <button id="rotate-page-btn" class="btn btn-primary">Otočit o 90°</button>
                        <button id="add-blank-page-btn" class="btn btn-primary">+ Prázdná str.</button>
                    </div>
                    <div class="btn-row">
                        <button id="move-page-up" class="btn btn-primary">↑ Posunout nahoru</button>
                        <button id="move-page-down" class="btn btn-primary">↓ Posunout dolů</button>
                    </div>
                    <div class="btn-row">
                        <button id="delete-selected-btn" class="btn btn-danger">Smazat vybrané</button>
                    </div>
                    <div class="btn-row">
                        <button id="save-pdf-btn" class="btn btn-success">💾 Uložit PDF</button>
                    </div>
                </section>

                <section>
                    <h2>🔗 Nástroje</h2>
                    <div class="form-group">
                        <label>Spojit PDF (vyberte níže):</label>
                        <div id="merge-list"></div>
                        <button id="merge-btn" class="btn btn-primary">Spojit vybrané</button>
                    </div>
                    <hr />
                    <div class="btn-row">
                        <button id="export-txt-btn" class="btn btn-primary">📝 Exportovat TXT</button>
                        <button id="split-pdf-btn" class="btn btn-primary">✂ Rozdělit PDF</button>
                    </div>
                    <hr />
                    <div class="form-group">
                        <label>Extrahovat stránky:</label>
                        <input type="text" id="extract-range" placeholder="např. 1-3,5,7-9" />
                        <button id="extract-pages-btn" class="btn btn-primary">Extrahovat</button>
                    </div>
                    <hr />
                    <div class="form-group">
                        <label>Vložit stránky z PDF:</label>
                        <input type="file" id="insert-pdf-input" accept=".pdf" />
                        <select id="insert-position" class="form-input">
                            <option value="before">Před aktuální str.</option>
                            <option value="after">Za aktuální str.</option>
                        </select>
                        <button id="insert-page-btn" class="btn btn-primary">Vložit</button>
                    </div>
                    <hr />
                    <div class="form-group">
                        <label>Obrázky → PDF:</label>
                        <input type="file" id="image-input" accept="image/*" multiple />
                        <button id="convert-images-btn" class="btn btn-primary">Konvertovat</button>
                    </div>
                </section>

            </aside>

            <div class="content">
                <section class="preview-section">
                    <div class="preview-toolbar">
                        <div class="toolbar-group">
                            <button id="zoom-out-btn" class="icon-btn" title="Oddálit">🔍−</button>
                            <span id="zoom-level">100%</span>
                            <button id="zoom-in-btn" class="icon-btn" title="Přiblížit">🔍+</button>
                            <button id="fit-page-btn" class="icon-btn" title="Výchozí zoom">⊞</button>
                        </div>
                        <div class="toolbar-group">
                            <button id="grid-toggle-btn" class="icon-btn" title="Zobrazení mřížky">⊟</button>
                            <button id="delete-mode-btn" class="icon-btn" title="Režim mazání">☑</button>
                        </div>
                    </div>
                    <div id="canvas-wrapper">
                        <canvas id="pdf-canvas"></canvas>
                        <div id="page-loader" class="spinner"></div>
                    </div>
                    <div id="grid-view" class="hidden"></div>
                    <div id="page-nav">
                        <button id="prev-page" class="icon-btn">◀</button>
                        <input type="number" id="page-jump" value="1" min="1" />
                        <span id="page-info">Stránka 1 z 1</span>
                        <button id="next-page" class="icon-btn">▶</button>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
